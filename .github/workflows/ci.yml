name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development checker
        run: python3 -m pip install ruff==0.11.11
      - name: Check Python style
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Validate Skill package
        run: python3 scripts/validate_project.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check command entry points
        run: |
          python3 scripts/search_cases.py --help >/dev/null
          python3 scripts/run_search_plan.py --help >/dev/null
          python3 scripts/expand_related_cases.py --help >/dev/null
          python3 scripts/build_browser_searches.py --help >/dev/null
          python3 scripts/search_wechat_tikhub.py --help >/dev/null
