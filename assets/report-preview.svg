<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">相似病例检索记录示意</title>
  <desc id="desc">一份检索记录包含检索范围、原文来源、相同点、重要差异、证据范围和未覆盖内容</desc>

  <rect width="1440" height="780" fill="#e9e4da"/>
  <rect x="64" y="48" width="1312" height="684" fill="#fbfaf6" stroke="#c6bfb3"/>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="104" y="99" fill="#a64f32" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">Search record</text>
    <text x="104" y="145" fill="#203138" font-family="Georgia, 'Songti SC', serif" font-size="36" font-weight="700">相似病例检索记录</text>
    <text x="104" y="177" fill="#6d7475" font-size="15">这里展示的是报告结构，不代表真实患者或检索结果</text>
    <text x="1182" y="108" fill="#6d7475" font-size="14">示意 / 01</text>
    <path d="M104 202H1336" stroke="#203138" stroke-width="2"/>

    <g transform="translate(104 238)">
      <text x="0" y="0" fill="#a64f32" font-size="13" letter-spacing="1.6">本次范围</text>
      <text x="0" y="38" fill="#203138" font-size="17" font-weight="600">已查</text>
      <text x="72" y="38" fill="#59666a" font-size="16">英文医学论文、相关文献与引用关系</text>
      <text x="0" y="72" fill="#203138" font-size="17" font-weight="600">受限</text>
      <text x="72" y="72" fill="#59666a" font-size="16">需要登录或机构订阅的部分中文来源</text>
      <text x="0" y="106" fill="#203138" font-size="17" font-weight="600">未查</text>
      <text x="72" y="106" fill="#59666a" font-size="16">用户没有要求的封闭平台</text>
      <path d="M0 138H308" stroke="#c6bfb3"/>

      <text x="0" y="178" fill="#a64f32" font-size="13" letter-spacing="1.6">阅读顺序</text>
      <text x="0" y="217" fill="#203138" font-family="Georgia, serif" font-size="24">1</text>
      <text x="34" y="215" fill="#59666a" font-size="16">先打开原文来源</text>
      <text x="0" y="257" fill="#203138" font-family="Georgia, serif" font-size="24">2</text>
      <text x="34" y="255" fill="#59666a" font-size="16">再看相同点与差异</text>
      <text x="0" y="297" fill="#203138" font-family="Georgia, serif" font-size="24">3</text>
      <text x="34" y="295" fill="#59666a" font-size="16">最后确认核验范围</text>
    </g>

    <path d="M466 238V674" stroke="#c6bfb3"/>

    <g transform="translate(510 238)">
      <text x="0" y="0" fill="#a64f32" font-family="Georgia, 'Times New Roman', serif" font-size="46">01</text>
      <text x="74" y="-1" fill="#203138" font-size="14" letter-spacing="1.2">最接近病例</text>
      <text x="74" y="31" fill="#203138" font-family="Georgia, 'Songti SC', serif" font-size="25" font-weight="700">保留论文原题、发表年份和稳定链接</text>
      <path d="M0 64H786" stroke="#c6bfb3"/>

      <text x="0" y="105" fill="#203138" font-size="17" font-weight="600">为什么纳入</text>
      <text x="150" y="105" fill="#59666a" font-size="16">主要表现、关键检查和时间关系接近</text>

      <text x="0" y="151" fill="#203138" font-size="17" font-weight="600">相同点</text>
      <circle cx="153" cy="146" r="4" fill="#a64f32"/>
      <text x="169" y="151" fill="#59666a" font-size="16">逐项列出原文明确报告的共同特征</text>
      <circle cx="153" cy="178" r="4" fill="#a64f32"/>
      <text x="169" y="183" fill="#59666a" font-size="16">区分症状、检查、暴露和治疗反应</text>

      <text x="0" y="231" fill="#203138" font-size="17" font-weight="600">重要差异</text>
      <circle cx="153" cy="226" r="4" fill="#a64f32"/>
      <text x="169" y="231" fill="#59666a" font-size="16">年龄、病程或关键指标并不一致</text>
      <circle cx="153" cy="258" r="4" fill="#a64f32"/>
      <text x="169" y="263" fill="#59666a" font-size="16">原文没写的内容标为未知，不自行补全</text>

      <text x="0" y="311" fill="#203138" font-size="17" font-weight="600">核验范围</text>
      <text x="150" y="311" fill="#59666a" font-size="16">题目 / 摘要 / 全文，按实际阅读情况标明</text>
      <path d="M0 346H786" stroke="#c6bfb3"/>

      <text x="0" y="388" fill="#a64f32" font-size="13" letter-spacing="1.6">仍需留意</text>
      <text x="0" y="424" fill="#203138" font-size="16">没有访问到的全文、检索失败的来源、尚未覆盖的渠道，以及停止继续查找的原因。</text>
    </g>

    <path d="M104 674H1336" stroke="#203138" stroke-width="2"/>
    <text x="104" y="706" fill="#6d7475" font-size="13">病例相似只用于文献回顾，不能代替诊断、治疗判断或个体预后评估。</text>
    <text x="1247" y="706" fill="#6d7475" font-size="13">SOURCE FIRST</text>
  </g>
</svg>
