<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Find Similar Medical Cases</title>
  <desc id="desc">从去除身份信息的病例出发，经过多来源检索，得到可以核对的相似病例记录</desc>

  <rect width="1440" height="640" fill="#f2eee5"/>
  <path d="M0 72H1440M0 568H1440" stroke="#c9c1b4" stroke-width="1"/>
  <path d="M72 0V640M1368 0V640" stroke="#c9c1b4" stroke-width="1"/>

  <g fill="#203138" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="96" y="112" font-size="16" letter-spacing="2.6">OPEN MEDICAL LITERATURE · 01</text>
    <text x="96" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-2">Find Similar</text>
    <text x="96" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-2">Medical Cases</text>
    <text x="100" y="374" font-size="23">从一段病例描述出发，找到可以回到原文核对的相似病例。</text>
  </g>

  <circle cx="101" cy="446" r="6" fill="#a64f32"/>
  <text x="122" y="453" fill="#59666a" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17">检索 · 去重 · 比较 · 记录未覆盖的范围</text>

  <g transform="translate(820 104)" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="0" y="15" fill="#7a756c" font-size="14" letter-spacing="1.8">SEARCH RECORD</text>
    <path d="M0 38H482" stroke="#203138" stroke-width="2"/>

    <text x="0" y="90" fill="#a64f32" font-family="Georgia, 'Times New Roman', serif" font-size="34">01</text>
    <text x="72" y="80" fill="#203138" font-size="18" font-weight="600">去除身份信息的病例</text>
    <text x="72" y="106" fill="#687276" font-size="15">表现、检查、用药、时间关系</text>
    <path d="M18 116V156" stroke="#a9a196" stroke-width="1.5"/>

    <text x="0" y="196" fill="#a64f32" font-family="Georgia, 'Times New Roman', serif" font-size="34">02</text>
    <text x="72" y="186" fill="#203138" font-size="18" font-weight="600">多条检索路径</text>
    <text x="72" y="212" fill="#687276" font-size="15">不预设诊断，换不同角度继续找</text>
    <path d="M18 222V262" stroke="#a9a196" stroke-width="1.5"/>

    <text x="0" y="302" fill="#a64f32" font-family="Georgia, 'Times New Roman', serif" font-size="34">03</text>
    <text x="72" y="292" fill="#203138" font-size="18" font-weight="600">论文与病例来源</text>
    <text x="72" y="318" fill="#687276" font-size="15">PubMed · Europe PMC · OpenAlex · 中文资料</text>
    <path d="M18 328V368" stroke="#a9a196" stroke-width="1.5"/>

    <text x="0" y="408" fill="#a64f32" font-family="Georgia, 'Times New Roman', serif" font-size="34">04</text>
    <text x="72" y="398" fill="#203138" font-size="18" font-weight="600">可复核的检索记录</text>
    <text x="72" y="424" fill="#687276" font-size="15">相同点、差异、证据范围与遗漏</text>
    <path d="M0 455H482" stroke="#203138" stroke-width="2"/>
  </g>

  <text x="96" y="604" fill="#7a756c" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.4">FIND-SIMILAR-MEDICAL-CASES</text>
  <text x="1258" y="604" fill="#7a756c" font-family="Arial, sans-serif" font-size="13">2026</text>
</svg>
