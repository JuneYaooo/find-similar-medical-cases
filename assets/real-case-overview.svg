<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">三组真实病例展示</title>
  <desc id="desc">泊沙康唑相关盐皮质激素过多、卵巢畸胎瘤相关抗 NMDAR 脑炎、儿茶酚胺敏感性多形性室速三组输入病例及相似病例结论。</desc>
  <rect width="1440" height="1000" fill="#f2eee5"/>
  <rect x="64" y="52" width="1312" height="896" fill="#fbfaf6" stroke="#c9c1b4"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="104" y="104" fill="#a64f32" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">Real cases / clinical comparison</text>
    <text x="104" y="152" fill="#203138" font-family="Georgia, 'Songti SC', serif" font-size="36" font-weight="700">真实病例展示</text>
    <text x="104" y="186" fill="#667174" font-size="16">输入病例 · 相似表现 · 治疗与结局</text>
    <path d="M104 216H1336" stroke="#203138" stroke-width="2"/>

    <g transform="translate(104 252)">
      <rect width="1232" height="184" fill="#e8eee9" stroke="#b9c9bf"/>
      <rect width="116" height="184" fill="#d2e0d6"/>
      <text x="28" y="62" fill="#a64f32" font-family="Georgia, serif" font-size="42">01</text>
      <text x="28" y="91" fill="#49695b" font-size="13">药物 / 内分泌</text>
      <text x="148" y="40" fill="#203138" font-size="20" font-weight="700">泊沙康唑后高血压与低钾</text>
      <text x="148" y="72" fill="#4e5d60" font-size="15">输入：高血压 · 低钾 · 代谢性碱中毒 · 低肾素 · 低醛固酮</text>
      <path d="M148 94H1198" stroke="#b9c9bf"/>
      <text x="148" y="125" fill="#a64f32" font-size="13" font-weight="700">相似病例模式</text>
      <text x="252" y="125" fill="#203138" font-size="15">不同年龄和基础疾病中，重复出现药物相关表观盐皮质激素过多。</text>
      <text x="148" y="155" fill="#a64f32" font-size="13" font-weight="700">治疗与结局</text>
      <text x="252" y="155" fill="#203138" font-size="15">停药、减量、换药或螺内酯后多有改善，个体机制和恢复过程不同。</text>
    </g>

    <g transform="translate(104 460)">
      <rect width="1232" height="184" fill="#f4e9df" stroke="#d8b8a4"/>
      <rect width="116" height="184" fill="#ead5c5"/>
      <text x="28" y="62" fill="#a64f32" font-family="Georgia, serif" font-size="42">02</text>
      <text x="28" y="91" fill="#8d5d46" font-size="13">神经免疫 / 妇科</text>
      <text x="148" y="40" fill="#203138" font-size="20" font-weight="700">急性精神症状、癫痫与卵巢畸胎瘤</text>
      <text x="148" y="72" fill="#4e5d60" font-size="15">输入：青年女性 · 精神行为异常 · 癫痫或异常运动 · 卵巢畸胎瘤</text>
      <path d="M148 94H1198" stroke="#d8b8a4"/>
      <text x="148" y="125" fill="#a64f32" font-size="13" font-weight="700">相似病例模式</text>
      <text x="252" y="125" fill="#203138" font-size="15">高度相似病例同时具有抗 NMDAR 抗体和卵巢畸胎瘤证据。</text>
      <text x="148" y="155" fill="#a64f32" font-size="13" font-weight="700">治疗与结局</text>
      <text x="252" y="155" fill="#203138" font-size="15">肿瘤切除联合免疫治疗后多数改善，但恢复速度与复发情况不同。</text>
    </g>

    <g transform="translate(104 668)">
      <rect width="1232" height="184" fill="#e9e4da" stroke="#c9c1b4"/>
      <rect width="116" height="184" fill="#dcd4c7"/>
      <text x="28" y="62" fill="#a64f32" font-family="Georgia, serif" font-size="42">03</text>
      <text x="28" y="91" fill="#7b5f48" font-size="13">遗传性心律失常</text>
      <text x="148" y="40" fill="#203138" font-size="20" font-weight="700">运动或情绪诱发抽搐样发作与双向室速</text>
      <text x="148" y="72" fill="#4e5d60" font-size="15">输入：儿童或年轻人 · 晕厥或心脏骤停 · 静息检查可正常 · 双向室速</text>
      <path d="M148 94H1198" stroke="#c9c1b4"/>
      <text x="148" y="125" fill="#a64f32" font-size="13" font-weight="700">相似病例模式</text>
      <text x="252" y="125" fill="#203138" font-size="15">运动试验、发作诱因和遗传结果比正常静息心电图更有区分力。</text>
      <text x="148" y="155" fill="#a64f32" font-size="13" font-weight="700">治疗与结局</text>
      <text x="252" y="155" fill="#203138" font-size="15">治疗从联合药物到 ICD、交感神经切除或 ECMO，取决于严重程度。</text>
    </g>

    <path d="M104 884H1336" stroke="#203138" stroke-width="2"/>
    <text x="104" y="918" fill="#203138" font-size="15" font-weight="700">共同结论</text>
    <text x="190" y="918" fill="#667174" font-size="15">症状顺序、诱因、药物时间关系和客观检查决定相似度；治疗与结局必须逐例比较。</text>
    <text x="1248" y="918" fill="#7a756c" font-size="12">SOURCE FIRST</text>
  </g>
</svg>
