<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">三组真实复杂病例检索结果</title>
  <desc id="desc">三组病例共完成 34 次实时来源调用，返回 609 条记录，形成 379 篇分主题去重候选；从 17 篇近似文章中核对到 25 个文献内患者单位。</desc>
  <rect width="1440" height="1040" fill="#f2eee5"/>
  <rect x="64" y="52" width="1312" height="936" fill="#fbfaf6" stroke="#c9c1b4"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="104" y="104" fill="#a64f32" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">Live evidence / three clinical fingerprints</text>
    <text x="104" y="152" fill="#203138" font-family="Georgia, 'Songti SC', serif" font-size="36" font-weight="700">真实病例，不是模拟数据</text>
    <text x="104" y="186" fill="#667174" font-size="16">药物不良反应 · 神经免疫 · 遗传性心律失常</text>
    <text x="1212" y="104" fill="#7a756c" font-size="13">RUN / 03</text>
    <path d="M104 216H1336" stroke="#203138" stroke-width="2"/>

    <g transform="translate(104 252)">
      <rect width="286" height="112" fill="#e8eee9" stroke="#b9c9bf"/>
      <text x="22" y="32" fill="#a64f32" font-size="12" letter-spacing="1.3">LIVE SOURCE CALLS</text>
      <text x="22" y="78" fill="#203138" font-family="Georgia, serif" font-size="44" font-weight="700">34 / 34</text>
      <text x="209" y="77" fill="#49695b" font-size="14">成功</text>
    </g>
    <g transform="translate(410 252)">
      <rect width="286" height="112" fill="#f4e9df" stroke="#d8b8a4"/>
      <text x="22" y="32" fill="#a64f32" font-size="12" letter-spacing="1.3">RETURNED RECORDS</text>
      <text x="22" y="78" fill="#203138" font-family="Georgia, serif" font-size="44" font-weight="700">609</text>
      <text x="126" y="77" fill="#667174" font-size="14">条</text>
    </g>
    <g transform="translate(716 252)">
      <rect width="286" height="112" fill="#e9e4da" stroke="#c9c1b4"/>
      <text x="22" y="32" fill="#a64f32" font-size="12" letter-spacing="1.3">CANDIDATE PAPERS</text>
      <text x="22" y="78" fill="#203138" font-family="Georgia, serif" font-size="44" font-weight="700">379</text>
      <text x="126" y="77" fill="#667174" font-size="14">分主题去重</text>
    </g>
    <g transform="translate(1022 252)">
      <rect width="314" height="112" fill="#203138"/>
      <text x="22" y="32" fill="#e7b39b" font-size="12" letter-spacing="1.3">PATIENT UNITS IN 17 PAPERS</text>
      <text x="22" y="78" fill="#fbfaf6" font-family="Georgia, serif" font-size="44" font-weight="700">25</text>
      <text x="87" y="77" fill="#d9e0db" font-size="14">文献内患者单位</text>
    </g>

    <text x="104" y="414" fill="#a64f32" font-size="13" letter-spacing="1.5">THREE CASE RUNS / 三组实际结果</text>
    <path d="M104 436H1336" stroke="#c9c1b4"/>

    <g transform="translate(104 470)">
      <text x="0" y="28" fill="#a64f32" font-family="Georgia, serif" font-size="36">01</text>
      <text x="64" y="21" fill="#203138" font-size="19" font-weight="700">泊沙康唑后高血压与低钾</text>
      <text x="64" y="49" fill="#667174" font-size="14">低肾素 · 低醛固酮 · 代谢性碱中毒</text>
      <rect x="526" y="0" width="606" height="62" fill="#e8eee9"/>
      <rect x="526" y="0" width="303" height="62" fill="#d2e0d6"/>
      <text x="550" y="26" fill="#203138" font-size="14">136 条返回 → 71 篇候选</text>
      <text x="550" y="49" fill="#49695b" font-size="14" font-weight="700">7 篇文章 / 8 个患者单位</text>
      <text x="1162" y="25" fill="#667174" font-size="13">药物不良反应</text>
      <text x="1162" y="48" fill="#667174" font-size="13">内分泌</text>
    </g>
    <path d="M104 558H1336" stroke="#c9c1b4"/>

    <g transform="translate(104 592)">
      <text x="0" y="28" fill="#a64f32" font-family="Georgia, serif" font-size="36">02</text>
      <text x="64" y="21" fill="#203138" font-size="19" font-weight="700">精神症状、癫痫与卵巢畸胎瘤</text>
      <text x="64" y="49" fill="#667174" font-size="14">意识改变 · 异常运动 · 抗 NMDAR 抗体</text>
      <rect x="526" y="0" width="606" height="62" fill="#f4e9df"/>
      <rect x="526" y="0" width="399" height="62" fill="#ead5c5"/>
      <text x="550" y="26" fill="#203138" font-size="14">240 条返回 → 158 篇候选</text>
      <text x="550" y="49" fill="#a64f32" font-size="14" font-weight="700">4 篇文章 / 9 个患者单位</text>
      <text x="1162" y="25" fill="#667174" font-size="13">神经免疫</text>
      <text x="1162" y="48" fill="#667174" font-size="13">妇科</text>
    </g>
    <path d="M104 680H1336" stroke="#c9c1b4"/>

    <g transform="translate(104 714)">
      <text x="0" y="28" fill="#a64f32" font-family="Georgia, serif" font-size="36">03</text>
      <text x="64" y="21" fill="#203138" font-size="19" font-weight="700">运动诱发晕厥与双向室速</text>
      <text x="64" y="49" fill="#667174" font-size="14">抽搐样发作 · 静息检查可正常 · RYR2 / CASQ2 / CALM2</text>
      <rect x="526" y="0" width="606" height="62" fill="#e9e4da"/>
      <rect x="526" y="0" width="379" height="62" fill="#dcd4c7"/>
      <text x="550" y="26" fill="#203138" font-size="14">233 条返回 → 150 篇候选</text>
      <text x="550" y="49" fill="#7b5f48" font-size="14" font-weight="700">6 篇文章 / 8 个患者单位</text>
      <text x="1162" y="25" fill="#667174" font-size="13">遗传性</text>
      <text x="1162" y="48" fill="#667174" font-size="13">心律失常</text>
    </g>

    <path d="M104 820H1336" stroke="#203138" stroke-width="2"/>
    <text x="104" y="854" fill="#a64f32" font-size="13" letter-spacing="1.5">WHAT THE CASES REVEALED / 病例共同提示</text>
    <circle cx="112" cy="889" r="5" fill="#a64f32"/>
    <text x="132" y="895" fill="#203138" font-size="15">表现与时间关系比共享一个疾病名称更能区分相似病例。</text>
    <circle cx="112" cy="924" r="5" fill="#a64f32"/>
    <text x="132" y="930" fill="#203138" font-size="15">初始误诊是重要线索：精神病路径、癫痫路径和常见药物不良反应路径都可能遮蔽真实诊断。</text>
    <circle cx="774" cy="889" r="5" fill="#a64f32"/>
    <text x="794" y="895" fill="#203138" font-size="15">公众号用于发现线索，病例结论回到 PMID、DOI 或开放全文。</text>
    <circle cx="774" cy="924" r="5" fill="#a64f32"/>
    <text x="794" y="930" fill="#203138" font-size="15">候选文献、文章和患者单位始终分开统计。</text>
    <path d="M104 954H1336" stroke="#c9c1b4"/>
    <text x="104" y="976" fill="#7a756c" font-size="13">实时来源：PubMed · Europe PMC · OpenAlex；公众号公开搜索作为二手发现路径。</text>
    <text x="1230" y="976" fill="#7a756c" font-size="13">SOURCE FIRST</text>
  </g>
</svg>
